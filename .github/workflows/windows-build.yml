name: NOVA Voice - Windows build

# Builds the Windows 11 (x64) installer and saves it as a downloadable artifact.
# Nothing is published and no secrets are needed.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VOICESTUDIO_RUST_TARGET: x86_64-pc-windows-msvc
      VOICESTUDIO_UPDATE_CHANNEL: electron-stable-win32-x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/desktop-bridge -> target
          key: nova-win-x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'
          enable-cache: false

      - name: Bundle uv with the app
        run: |
          mkdir -p electron/build/uv
          UV_PATH="$(command -v uv)"
          echo "uv found at: $UV_PATH"
          cp "$UV_PATH" electron/build/uv/uv-x86_64-pc-windows-msvc.exe

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Informational: these show problems early but do not block the installer.
      - name: Type check (informational)
        continue-on-error: true
        run: bun run typecheck
      - name: Unit tests (informational)
        continue-on-error: true
        run: bun run test

      - name: Build the app
        run: |
          bun run --cwd electron build:web
          bun run --cwd electron build

      - name: Package the Windows installer
        working-directory: electron
        run: bun x electron-builder --config electron-builder.config.mjs --win --x64 --publish never

      - name: Save the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NOVA-Voice-Windows-x64
          retention-days: 30
          if-no-files-found: error
          path: |
            electron/release/*.exe
            electron/release/*.exe.blockmap
